[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyctl"
version = "0.1.0"
description = "Multi-account Bluesky automation library and CLI"
requires-python = ">=3.10"
dependencies = [
    "atproto>=0.0.55",
    "apscheduler>=3.10",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "httpx>=0.24",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
agents = ["anthropic>=0.40"]
# MCP server (stdio and streamable HTTP), the HTTP service and inbound OIDC auth.
mcp = ["mcp>=1.9", "starlette>=0.40", "uvicorn>=0.30", "anyio>=4", "pyjwt[crypto]>=2.7"]
server = ["skyctl[mcp]"]
# Cloud adapters: each installs only the native SDKs its ports need
# (state with real compare-and-swap, secrets, queue, delayed delivery).
aws = ["boto3>=1.34", "awslambdaric>=2.0"]
azure = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.8", "azure-storage-blob>=12.19", "azure-servicebus>=7.11"]
gcp = ["google-cloud-storage>=2.14", "google-cloud-secret-manager>=2.18", "google-cloud-pubsub>=2.19", "google-cloud-tasks>=2.16"]
# Generic fallback for other fsspec schemes (no atomic CAS; see CLOUD_FRAMEWORK.md §5).
fsspec = ["fsspec>=2024.0"]
# Everything a cloud image needs.
all = ["skyctl[agents,mcp,aws,azure,gcp]"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
test = [
    "pytest>=7", "fsspec>=2024.0", "mcp>=1.9", "starlette>=0.40", "anyio>=4", "pyjwt[crypto]>=2.7",
    "moto[s3,sqs,scheduler]>=5.0", "boto3>=1.34",
    "azure-storage-blob>=12.19", "azure-servicebus>=7.11", "google-cloud-storage>=2.14", "google-cloud-tasks>=2.16",
]

[project.entry-points."skyctl.platforms"]
# Third-party platforms register here, e.g.  oci = "skyctl_oci:OciPlatform"

[project.scripts]
skyctl = "skyctl.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["skyctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: contract tests against emulators or real cloud accounts (skipped unless configured)"]
