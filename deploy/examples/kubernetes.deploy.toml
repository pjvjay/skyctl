# Kubernetes on every cloud: EKS, AKS and GKE (existing clusters).
# Same intent as managed.deploy.toml; only [targets] differ. skyctl creates
# the cloud-side backing services (state bucket, queue, secrets) and the
# workload-identity binding — identical to the managed option — and renders
# the workloads as Kubernetes manifests.
#
#   skyctl deploy check  deploy/examples/kubernetes.deploy.toml
#   skyctl deploy render deploy/examples/kubernetes.deploy.toml --target aws --out build
#   cd build/aws && terraform init && terraform apply      # also writes bind.json
#   kubectl apply -f bind.json && kubectl apply -f manifests.json
#
# Everything above [targets] is cloud-neutral intent. Secrets are never
# written here: Terraform targets take them as sensitive variables
# (TF_VAR_secrets_json), Kubernetes and Compose reference existing secrets.

[app]
name = "skyctl"
image = "ghcr.io/example/skyctl:1.2.0"

[runtime]
model = "anthropic:claude-opus-5-5"
log_format = "json"
delayed_delivery = true
search = "gdelt://"           # web/news search for agents (brave:// / tavily:// need a key in the secrets map)

[policy]                      # ceilings for every agent run, identical on every target
allow_writes = true
allow_delete = false
max_writes = 5
max_turns = 25
max_run_seconds = 540
accounts = ["work"]

[service]                     # /mcp, /runs, /invoke
enabled = true
public = false
min_instances = 0
max_instances = 2
auth = ["bearer"]

[worker]
enabled = true
max_concurrency = 2
visibility_seconds = 900
max_attempts = 5
poll_minutes = 1              # Azure Container Apps drains the Storage Queue on this schedule

[state]                       # the bucket holding the JSON job document; created on every cloud target
versioning = true
retention_days = 90           # runs/ and ledger/ expire after this
protect = true                # prevent_destroy: `terraform destroy` keeps the scheduled posts

[[schedules]]
name = "tick"
cron = "*/5 * * * *"
invoke = { kind = "tick" }
timeout_s = 300

[[schedules]]
name = "daily-engagement"
cron = "0 9 * * mon-fri"
timezone = "UTC"              # Azure Container Apps Jobs are UTC-only; validate() enforces it
invoke = { kind = "task.run", task = "daily-engagement" }
timeout_s = 900

[tasks.daily-engagement]
goal = "Read the work account's notifications and draft replies to genuine product questions."
accounts = ["work"]
allow_writes = true
max_writes = 5
approval = "writes"

[targets.aws]
region = "us-east-1"
compute = "eks"
model = "bedrock:anthropic.claude-opus-5-5"

[targets.aws.kubernetes]
cluster_name = "platform-prod"
namespace = "skyctl"
identity = "pod-identity"     # or "irsa" with oidc_provider_arn + oidc_issuer
keda = true
keda_operator_role_arn = "arn:aws:iam::123456789012:role/keda-operator"

[targets.azure]
location = "westeurope"
compute = "aks"
model = "azure-openai:gpt-4.1"
openai_endpoint = "https://skyctl-openai.openai.azure.com"

[targets.azure.kubernetes]
cluster_name = "platform-prod"
cluster_resource_group = "platform-rg"
namespace = "skyctl"
keda = true

[targets.gcp]
project = "my-skyctl-project"
region = "europe-west1"
compute = "gke"
model = "vertex:claude-opus-5-5"

[targets.gcp.kubernetes]
namespace = "skyctl"
keda = true
