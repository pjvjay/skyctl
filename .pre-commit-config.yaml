# pip install pre-commit && pre-commit install
# The same checks run in CI (.github/workflows/ci.yml); this runs the fast ones before each commit.
exclude: ^deploy/generated/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in step with the ruff pin in pyproject.toml (dev extra)
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: license-headers
        name: Apache-2.0 licence headers
        entry: python scripts/license_headers.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
